name: Publicar API da comunidade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/community-registration-worker/**'
      - '.github/workflows/deploy-community-worker.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-community-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar e publicar Worker
    # O repositório privado é a fonte da versão, mas os secrets de produção
    # pertencem somente ao espelho público. A sincronização dispara este mesmo
    # workflow no destino correto sem produzir uma falsa falha na fonte privada.
    if: github.repository == 'jean7rafael/13calendar-public'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/community-registration-worker/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix cloudflare/community-registration-worker

      - name: Conferir pacote do Worker
        working-directory: cloudflare/community-registration-worker
        run: npx wrangler deploy --dry-run

      # As migrações fazem parte da publicação. Assim, uma nova rota nunca
      # chega à produção antes da tabela correspondente existir no D1.
      - name: Aplicar migrações do banco de produção
        working-directory: cloudflare/community-registration-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Publicar API comunitária
        working-directory: cloudflare/community-registration-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
