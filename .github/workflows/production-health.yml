name: Verificar produção

on:
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    name: Site, dados públicos e comunidade
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Conferir páginas e arquivos de indexação
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://13calendar.pages.dev/ --output main.html
          curl --fail --silent --show-error --location --retry 3 \
            https://13calendar.pages.dev/reference-site/ --output reference.html
          curl --fail --silent --show-error --location --retry 3 \
            https://13calendar.pages.dev/robots.txt --output robots.txt
          curl --fail --silent --show-error --location --retry 3 \
            https://13calendar.pages.dev/sitemap.xml --output sitemap.xml

          grep -q 'https://13calendar.pages.dev/' main.html
          grep -q '13calendar.pages.dev/sitemap.xml' robots.txt
          grep -q '<urlset' sitemap.xml

          reference_asset="$(grep -oE '(\./|/reference-site/)assets/index-[A-Za-z0-9_-]+\.js' reference.html | head -n 1)"
          test -n "$reference_asset"
          if [[ "$reference_asset" == ./* ]]; then
            reference_url="https://13calendar.pages.dev/reference-site/${reference_asset#./}"
          else
            reference_url="https://13calendar.pages.dev${reference_asset}"
          fi
          curl --fail --silent --show-error --location --retry 3 \
            "$reference_url" --output reference.js
          grep -Fq 'Mês {month} de 13 · Semana {week} de 4' reference.js
          if grep -Fq 'da 13ª' reference.js; then
            echo 'A tradução ordinal antiga voltou ao pacote educacional.' >&2
            exit 1
          fi

      - name: Conferir API comunitária pública
        shell: bash
        run: |
          set -euo pipefail
          api='https://13calendar-community-registration.13calendar-community-registration-worker.workers.dev'
          curl --fail --silent --show-error --location --retry 3 \
            "$api/analytics/stats" --output analytics.json
          curl --fail --silent --show-error --location --retry 3 \
            "$api/members" --output members.json
          curl --fail --silent --show-error --location --retry 3 \
            "$api/feedback/votes" --output feedback.json

          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('analytics.json')); if (!data.status) process.exit(1)"
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('members.json')); if (!Array.isArray(data.members)) process.exit(1)"
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('feedback.json')); if (!Array.isArray(data.votes) || data.votes.length !== 4 || !data.votes.every(Number.isInteger)) process.exit(1)"
