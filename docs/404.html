<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>13 Calendar</title>
    <link rel="canonical" href="https://13calendar.pages.dev/" />
    <meta http-equiv="refresh" content="0; url=https://13calendar.pages.dev/" />
    <script>
      (function () {
        var legacyBase = "/13calendar-public";
        var path = window.location.pathname.indexOf(legacyBase) === 0
          ? window.location.pathname.slice(legacyBase.length)
          : "/";
        var destination = new URL(path || "/", "https://13calendar.pages.dev/");
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
  </head>
  <body>
    <p>
      This project moved to
      <a href="https://13calendar.pages.dev/">13calendar.pages.dev</a>.
    </p>
  </body>
